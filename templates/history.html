<!DOCTYPE html>
<html>

<head>
<title>History</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>

<body>

<div class="sidebar">

<h2>📰 Fake News</h2>

<a href="/">🏠 Home</a>

<a href="/check">🔍 Check News</a>

<a href="/history">📜 History</a>

<a href="/accuracy">📊 Accuracy Dashboard</a>

<a href="#" onclick="toggleMode()">🌙 Dark Mode</a>

</div>


<div class="main">
<div class="container">

<div class="card">

<h2>Prediction History</h2>

<div style="overflow-x:auto;">

<table>

<tr>
<th>News</th>
<th>Result</th>
<th>Confidence</th>
<th>Time</th>
<th>Delete</th>
</tr>

{% for item in history %}

<tr>

<td>{{ item[1] }}</td>
<td>{{ item[2] }}</td>
<td>{{ item[3] }}%</td>
<td>{{ item[4] }}</td>
<td>
<form action="/delete/{{ item[0] }}" method="post" style="margin:0;">
<button type="submit" style="margin:0;">Delete</button>
</form>
</td>

</tr>

{% endfor %}

</table>

</div>

<a href="/download" class="btn">Download CSV</a>

<form action="/clear" method="post">
<button type="submit">Clear History</button>
</form>

</div>

</div>
</div>

</body>
</html>
